<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ALLIM QURAN Hadith Embrace identity v4</title>
  <desc id="desc">Logo system derived from the user's sketch: crossing embrace ribbons, open Book, digital knowledge point and modern mint palette.</desc>
  <rect width="1600" height="1120" fill="#EFF4EF"/>
