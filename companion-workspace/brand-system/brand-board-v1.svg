<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">ALLIM QURAN Brand System v1</title>
  <desc id="desc">Primary logo, embrace-based symbol concepts, app icon, color palette and usage architecture.</desc>
  <rect width="1600" height="1200" fill="#F4F0E7"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#0B3D33">
    <text x="96" y="92" font-size="20" font-weight="600" letter-spacing="4">ALLIM QURAN</text>
    <text x="96" y="142" font-size="42" font-weight="500">Brand system · Direction 01</text>
    <text x="1504" y="104" text-anchor="end" font-size="17" letter-spacing="2">TEACHING · CARE · KNOWLEDGE</text>
  </g>

  <rect x="72" y="190" width="1456" height="260" rx="34" fill="#0B3D33"/>
  <image href="assets/logos/allim-primary-horizontal-reverse.svg" x="120" y="220" width="900" height="198"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#F4F0E7">
    <text x="1120" y="294" font-size="16" font-weight="600" letter-spacing="3">PRIMARY LOCKUP</text>
    <text x="1120" y="338" font-size="25">Clear at small sizes.</text>
    <text x="1120" y="374" font-size="25">Warm, calm, intelligent.</text>
    <path d="M1120 400H1438" stroke="#C8A96B" stroke-width="2"/>
  </g>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="96" y="520" fill="#0B3D33" font-size="18" font-weight="600" letter-spacing="3">SYMBOL DIRECTIONS</text>

    <g transform="translate(72 552)">
      <rect width="400" height="340" rx="28" fill="#FFFFFF"/>
      <image href="assets/logos/allim-embrace-page.svg" x="108" y="32" width="184" height="184"/>
      <circle cx="338" cy="54" r="24" fill="#0B3D33"/>
      <path d="M327 54L335 62L350 45" fill="none" stroke="#F4F0E7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="258" fill="#0B3D33" font-size="24" font-weight="600">A · Embrace Page</text>
      <text x="36" y="294" fill="#176653" font-size="17">Embrace + open Book + light</text>
      <text x="36" y="321" fill="#C8A96B" font-size="15" font-weight="600" letter-spacing="2">RECOMMENDED</text>
    </g>

    <g transform="translate(504 552)">
      <rect width="400" height="340" rx="28" fill="#FFFFFF"/>
      <image href="assets/logos/allim-embrace-knot.svg" x="108" y="32" width="184" height="184"/>
      <text x="36" y="258" fill="#0B3D33" font-size="24" font-weight="600">B · Knowledge Knot</text>
      <text x="36" y="294" fill="#176653" font-size="17">Connection + transmission</text>
      <text x="36" y="321" fill="#71807B" font-size="15" letter-spacing="2">SECONDARY EXPLORATION</text>
    </g>

    <g transform="translate(936 552)">
      <rect width="400" height="340" rx="28" fill="#FFFFFF"/>
      <image href="assets/logos/allim-q-embrace.svg" x="108" y="32" width="184" height="184"/>
      <text x="36" y="258" fill="#0B3D33" font-size="24" font-weight="600">C · Q Embrace</text>
      <text x="36" y="294" fill="#176653" font-size="17">Q letter + Book + protection</text>
      <text x="36" y="321" fill="#71807B" font-size="15" letter-spacing="2">ALTERNATIVE</text>
    </g>

    <g transform="translate(1368 552)">
      <rect width="160" height="340" rx="28" fill="#0B3D33"/>
      <image href="assets/logos/allim-app-icon.svg" x="22" y="26" width="116" height="116"/>
      <text x="80" y="189" text-anchor="middle" fill="#F4F0E7" font-size="15" font-weight="600">APP ICON</text>
      <text x="80" y="222" text-anchor="middle" fill="#DEC995" font-size="13">Small-size</text>
      <text x="80" y="244" text-anchor="middle" fill="#DEC995" font-size="13">ready</text>
    </g>
