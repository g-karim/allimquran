  <g transform="translate(72 936)" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <rect width="1456" height="188" rx="28" fill="#FFFFFF"/>
    <text x="32" y="42" fill="#0B3D33" font-size="16" font-weight="600" letter-spacing="3">CORE PALETTE</text>
    <circle cx="56" cy="103" r="28" fill="#0B3D33"/>
