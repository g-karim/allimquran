    <text x="98" y="124" fill="#71807B" font-size="15">#0B3D33</text>
    <circle cx="314" cy="103" r="28" fill="#F4F0E7" stroke="#DDD8CE"/>
    <text x="356" y="99" fill="#0B3D33" font-size="17" font-weight="600">Warm Ivory</text>
    <text x="356" y="124" fill="#71807B" font-size="15">#F4F0E7</text>
    <circle cx="548" cy="103" r="28" fill="#C8A96B"/>
    <text x="590" y="99" fill="#0B3D33" font-size="17" font-weight="600">Muted Gold</text>
    <text x="590" y="124" fill="#71807B" font-size="15">#C8A96B</text>

    <path d="M800 36V152" stroke="#E5E1D8"/>
    <text x="842" y="60" fill="#0B3D33" font-size="16" font-weight="600" letter-spacing="3">SYSTEM ROLE</text>
    <text x="842" y="96" fill="#176653" font-size="17">Primary: clear ALLIM QURAN lockup</text>
    <text x="842" y="124" fill="#176653" font-size="17">Display: carved QURAN inside ALLIM</text>
    <text x="842" y="152" fill="#176653" font-size="17">Icon: Embrace Page symbol</text>
  </g>

  <text x="96" y="1170" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#71807B" font-size="14">Concept board · vector masters included · Arabic lockup follows after symbol approval</text>
