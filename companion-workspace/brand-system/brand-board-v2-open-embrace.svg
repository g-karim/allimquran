<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">ALLIM QURAN symbol correction — open embrace</title>
  <desc id="desc">Three non-oval symbols designed to avoid the visual association with a coffee bean.</desc>
  <rect width="1500" height="860" fill="#F4F0E7"/>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="80" y="82" fill="#0B3D33" font-size="18" font-weight="600" letter-spacing="4">ALLIM QURAN</text>
    <text x="80" y="132" fill="#0B3D33" font-size="38" font-weight="500">Open embrace · corrected symbol direction</text>
    <text x="1420" y="91" text-anchor="end" fill="#71807B" font-size="16" letter-spacing="2">NO OVAL · NO SEED · NO SILHOUETTE</text>

    <g transform="translate(80 188)">
      <rect width="420" height="520" rx="30" fill="#FFFFFF"/>
      <image href="assets/logos/allim-open-embrace-book.svg" x="90" y="40" width="240" height="240"/>
      <text x="38" y="340" fill="#0B3D33" font-size="27" font-weight="600">01 · Open Embrace</text>
      <text x="38" y="378" fill="#176653" font-size="18">Protective arc + explicit open Book</text>
      <text x="38" y="414" fill="#71807B" font-size="16">Warm, calm, distinctive at small scale.</text>
      <rect x="38" y="452" width="176" height="36" rx="18" fill="#0B3D33"/>
      <text x="126" y="476" text-anchor="middle" fill="#F4F0E7" font-size="13" font-weight="600" letter-spacing="2">RECOMMENDED</text>
    </g>

    <g transform="translate(540 188)">
      <rect width="420" height="520" rx="30" fill="#FFFFFF"/>
      <image href="assets/logos/allim-held-pages.svg" x="90" y="40" width="240" height="240"/>
      <text x="38" y="340" fill="#0B3D33" font-size="27" font-weight="600">02 · Held Pages</text>
      <text x="38" y="378" fill="#176653" font-size="18">Two arms + angular book geometry</text>
      <text x="38" y="414" fill="#71807B" font-size="16">More technical and structured.</text>
    </g>

    <g transform="translate(1000 188)">
      <rect width="420" height="520" rx="30" fill="#FFFFFF"/>
      <image href="assets/logos/allim-embrace-ribbons.svg" x="90" y="40" width="240" height="240"/>
      <text x="38" y="340" fill="#0B3D33" font-size="27" font-weight="600">03 · Embrace Ribbons</text>
      <text x="38" y="378" fill="#176653" font-size="18">Two gestures meet and form pages</text>
      <text x="38" y="414" fill="#71807B" font-size="16">Most abstract and architectural.</text>
    </g>

    <rect x="80" y="748" width="1340" height="54" rx="27" fill="#0B3D33"/>
    <text x="750" y="782" text-anchor="middle" fill="#F4F0E7" font-size="16" letter-spacing="2">THE EMBRACE IS EXPRESSED BY DIRECTION AND PROTECTION — NOT BY A HUMAN FIGURE</text>
  </g>
</svg>
