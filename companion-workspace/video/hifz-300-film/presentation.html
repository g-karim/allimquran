<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALLIM — Коран в сердце</title>
  <link rel="stylesheet" href="presentation.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Кадр фильма ALLIM">
    <div class="paper-texture" aria-hidden="true"></div>
    <div class="mushaf-frame" aria-hidden="true"></div>

    <header class="brandbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>ALLIM</strong><small>QUR’AN COMPANION</small></span>
      </div>
      <div class="film-name" id="film-name">КОРАН В СЕРДЦЕ</div>
      <div class="chapter" id="chapter">01 / 06</div>
    </header>

    <section class="scene" id="scene">
      <div class="copy">
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="title"></h1>
        <p id="description"></p>
        <div class="feature-list" id="features"></div>
      </div>

      <div class="visual" id="visual">
        <div class="intro-heart" id="intro-heart" aria-hidden="true">
          <div class="rings"><span>100</span><span>100</span><span>100</span></div>
          <strong>300</strong>
          <small id="intro-unit">ПОВТОРЕНИЙ</small>
          <em>♥</em>
        </div>

        <figure class="screen-frame" id="screen-frame">
          <div class="windowbar"><i></i><i></i><i></i><span>allimquran.com</span></div>
          <img id="screen" alt="Интерфейс ALLIM">
        </figure>

        <div class="flow" id="flow" aria-hidden="true">
          <article><b>01</b><strong data-flow-title="0">Повторять</strong><small data-flow-text="0">100 + 100 + 100</small></article>
          <span>→</span>
          <article><b>02</b><strong data-flow-title="1">Проверять</strong><small data-flow-text="1">Страница наизусть</small></article>
          <span>→</span>
          <article><b>03</b><strong data-flow-title="2">Осмыслить</strong><small data-flow-text="2">Личная запись</small></article>
          <span>→</span>
          <article><b>04</b><strong data-flow-title="3">Действовать</strong><small data-flow-text="3">Один ясный шаг</small></article>
        </div>

        <div class="metric" id="metric"><strong></strong><span></span></div>
      </div>
    </section>

    <footer class="footerline">
      <span class="progress"><i id="progress"></i></span>
      <small>اللَّهُمَّ عَلِّمْهُ الْكِتَابَ</small>
    </footer>
  </main>
  <script src="presentation.js?v=3"></script>
</body>
</html>
