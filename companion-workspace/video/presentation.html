<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALLIM — презентационное видео</title>
  <link rel="stylesheet" href="presentation.css">
</head>
<body>
  <main class="stage" id="stage" aria-label="Кадр презентации ALLIM">
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="ornament ornament-a" aria-hidden="true"></div>
    <div class="ornament ornament-b" aria-hidden="true"></div>

    <header class="brandbar">
      <div class="brandmark"><span class="brand-letter">ع</span><span><strong>ALLIM</strong><small>QUR’AN COMPANION</small></span></div>
      <div class="chapter" id="chapter">01 / 07</div>
    </header>

    <section class="scene" id="scene">
      <div class="copy">
        <span class="eyebrow" id="eyebrow">ЕДИНЫЙ ПУТЬ</span>
        <h1 id="title">Коран становится тем, что вы помните, понимаете и чем живёте.</h1>
        <p id="description">Чтение, запоминание, смысл и обучение собраны в одном спокойном пространстве.</p>
        <div class="features" id="features"></div>
      </div>

      <div class="product-wrap">
        <div class="product-glow" aria-hidden="true"></div>
        <figure class="product-frame">
          <div class="windowbar"><i></i><i></i><i></i><span>allimquran.com</span></div>
          <img id="screen" src="assets/01-home-ru.png" alt="Интерфейс ALLIM">
        </figure>
        <div class="metric" id="metric"><strong>1</strong><span>аят за раз</span></div>
      </div>
    </section>

    <footer class="timeline"><span id="timeline"></span><small>اللَّهُمَّ عَلِّمْهُ الْكِتَابَ</small></footer>
  </main>
  <script src="presentation.js"></script>
</body>
</html>
