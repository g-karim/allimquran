<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLIM QURAN verified mobile recitation plate</title>
  <style>
    :root {
      --ink: #0d3832;
      --deep: #123f38;
      --jade: #2e9f83;
      --ivory: #f7f3e9;
      --paper: #fffdf8;
      --gold: #c5a45f;
      --line: rgba(13, 56, 50, .13);
    }

    * { box-sizing: border-box; }
    html { width: 512px; height: 720px; margin: 0; overflow: hidden; }
    body {
      width: 640px;
      height: 900px;
      margin: 0;
      overflow: hidden;
      transform: scale(.8);
      transform-origin: top right;
      color: var(--ink);
      font-family: "SF Arabic", "Geeza Pro", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 5%, rgba(46, 159, 131, .12), transparent 28%),
        linear-gradient(180deg, var(--paper), var(--ivory));
    }

    .shell { min-height: 100%; padding: 38px 42px 36px; }
    .brandbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      direction: ltr;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    .brand i {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      color: white;
      background: linear-gradient(145deg, var(--jade), var(--deep));
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-style: normal;
      font-weight: 800;
    }
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(13, 56, 50, .72);
      font-size: 15px;
      font-weight: 700;
      direction: rtl;
    }
    .verified::before {
      content: "✓";
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: white;
      background: var(--jade);
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    header { margin-top: 38px; text-align: right; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    h1 { margin: 0; font-size: 35px; line-height: 1.25; }
    header p { margin: 9px 0 0; color: rgba(13, 56, 50, .64); font-size: 18px; }

    .ayah-card {
      position: relative;
      margin-top: 34px;
      padding: 30px 30px 32px;
      overflow: hidden;
      border: 1px solid rgba(197, 164, 95, .35);
      border-radius: 32px;
      background: rgba(255, 253, 248, .96);
      box-shadow: 0 24px 60px rgba(13, 56, 50, .1);
    }
    .ayah-card::after {
      content: "";
      position: absolute;
      left: -120px;
      bottom: -170px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(46, 159, 131, .1);
      border-radius: 50%;
      pointer-events: none;
    }
    .surah-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(13, 56, 50, .66);
      font-size: 16px;
      font-weight: 700;
    }
    .surah-row strong { color: var(--ink); font-size: 19px; }
    .rule { height: 1px; margin: 22px 0 34px; background: var(--line); }
    .ayah {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #102f2b;
      font-family: "KFGQPC Uthman Taha Naskh", "Geeza Pro", "SF Arabic", serif;
      font-size: 54px;
      font-weight: 600;
      line-height: 1.85;
      text-align: center;
      white-space: nowrap;
    }
    .ayah mark {
      padding: 4px 10px 8px;
      border-radius: 14px;
      color: inherit;
      background: rgba(197, 164, 95, .21);
      box-shadow: inset 0 -2px 0 rgba(197, 164, 95, .52);
    }
    .instruction {
      position: relative;
      z-index: 1;
      margin: 24px 0 0;
      color: rgba(13, 56, 50, .6);
      font-size: 16px;
      text-align: center;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 26px;
    }
    .action {
      display: grid;
      place-items: center;
      min-height: 70px;
      border: 1px solid var(--line);
      border-radius: 21px;
      color: var(--ink);
      background: rgba(255, 255, 255, .6);
      font-size: 18px;
      font-weight: 750;
    }
    .action.primary { color: white; background: var(--deep); }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      color: rgba(13, 56, 50, .62);
      font-size: 15px;
      font-weight: 700;
    }
    .progress { height: 8px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: rgba(13, 56, 50, .1); }
    .progress i { display: block; width: 25%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--jade), var(--gold)); }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brandbar">
      <div class="brand"><i>A</i><span>ALLIM QURAN</span></div>
      <span class="verified">نص قرآني موثّق</span>
    </div>

    <header>
      <p class="eyebrow">وضع التلاوة</p>
      <h1>اقرأ بالسرعة المناسبة لك</h1>
      <p>استمع، ثم اقرأ، ثم راجع تقدّمك.</p>
    </header>

    <section class="ayah-card" aria-label="سورة الإخلاص، الآية الأولى">
      <div class="surah-row"><strong>سورة الإخلاص</strong><span>الآية ١ من ٤</span></div>
      <div class="rule"></div>
      <p class="ayah"><mark>قُلْ</mark> هُوَ اللَّهُ أَحَدٌ ۝١</p>
      <p class="instruction">اضغط على الكلمة لفهم معناها.</p>
    </section>

    <div class="actions">
      <div class="action primary">ابدأ التلاوة</div>
      <div class="action">استمع أولًا</div>
    </div>

    <div class="progress-label"><span>تقدّم السورة</span><span>١ / ٤</span></div>
    <div class="progress"><i></i></div>
  </main>
</body>
</html>
