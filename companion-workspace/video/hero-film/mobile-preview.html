<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLIM QURAN — mobile video QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      background: #071b17;
      font-family: system-ui, sans-serif;
    }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border: 10px solid #101614;
      border-radius: 48px;
      background: #061713;
      box-shadow: 0 28px 80px rgb(0 0 0 / .45);
      transform: scale(.76);
    }
    .device::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 50%;
      width: 112px;
      height: 26px;
      border-radius: 99px;
      background: #101614;
      transform: translateX(-50%);
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #061713;
    }
  </style>
</head>
<body>
  <main class="device" aria-label="Проверка видео ALLIM QURAN в области 390 на 844 пикселя">
    <video id="film" muted playsinline preload="auto">
      <source src="output/ALLIM-Quran-Hero-Film-Universal-Web-720p.mp4" type="video/mp4">
    </video>
  </main>
  <script>
    const film = document.getElementById("film");
    film.addEventListener("loadedmetadata", () => { film.currentTime = 6.2; }, { once: true });
    film.addEventListener("seeked", () => { film.pause(); }, { once: true });
  </script>
</body>
</html>
