<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLIM QURAN hero film plates</title>
  <style>
    :root {
      --ink: #071f1c;
      --deep: #0b332f;
      --teal: #1d8f94;
      --jade: #2eae8c;
      --ivory: #f4f0e7;
      --gold: #c8a96b;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: var(--ivory);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 17% 18%, rgba(46, 174, 140, .32), transparent 29%),
        radial-gradient(circle at 82% 78%, rgba(200, 169, 107, .18), transparent 27%),
        linear-gradient(135deg, #061815 0%, var(--deep) 52%, #092723 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(244, 240, 231, .09);
      transform: rotate(45deg);
      pointer-events: none;
    }
    body::before { left: -250px; top: -220px; }
    body::after { right: -270px; bottom: -250px; }

    .ui-stage {
      position: relative;
      display: none;
      width: 1040px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(244, 240, 231, .2);
      border-radius: 30px;
      background: #f4f0e7;
      box-shadow: 0 42px 90px rgba(0, 0, 0, .42);
      transform: rotate(-.45deg);
    }

    .ui-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3);
      pointer-events: none;
    }

    .ui-stage img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .film-mark {
      position: fixed;
      top: 42px;
      left: 54px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .film-mark i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 6px rgba(200, 169, 107, .12);
    }

    .final-card {
      display: none;
      width: min(1080px, calc(100vw - 120px));
      text-align: center;
    }
    .final-card img {
      display: block;
      width: 700px;
      max-width: 82%;
      margin: 0 auto 34px;
      filter: drop-shadow(0 22px 34px rgba(0, 0, 0, .2));
    }
    .principles {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      width: min(940px, 100%);
      margin: 0 auto;
    }
    .principle {
      display: grid;
      align-content: center;
      min-height: 86px;
      padding: 14px 16px 16px;
      border: 1px solid rgba(244, 240, 231, .16);
      border-radius: 20px;
      background: rgba(244, 240, 231, .055);
    }
    .principle small {
      margin-bottom: 6px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
    }
    .principle span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      line-height: 1.05;
    }
    .principle:last-child {
      border-color: rgba(200, 169, 107, .58);
      background: linear-gradient(145deg, rgba(200, 169, 107, .16), rgba(46, 174, 140, .11));
    }
    .final-card .arabic {
      margin: 22px 0 0;
      color: rgba(244, 240, 231, .86);
      font-family: "SF Arabic", "Geeza Pro", Tahoma, Arial, sans-serif;
      font-size: 25px;
      line-height: 1.35;
    }
    .final-card .russian {
      margin: 9px 0 0;
      color: rgba(244, 240, 231, .74);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .105em;
    }
    .final-card .russian strong {
      color: var(--gold);
      font-weight: 850;
    }
    .final-card .domain {
      display: inline-flex;
      margin-top: 25px;
      padding: 11px 20px;
      border: 1px solid rgba(244, 240, 231, .24);
      border-radius: 999px;
      color: rgba(244, 240, 231, .76);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    body[data-plate="final"] .film-mark,
    body[data-plate="final"] .ui-stage { display: none; }
    body[data-plate="final"] .final-card { display: block; }
    body:not([data-plate="final"]) .ui-stage { display: block; }
  </style>
</head>
<body>
  <div class="film-mark" aria-hidden="true"><i></i><span>ALLIM QURAN</span></div>

  <figure class="ui-stage" aria-label="ALLIM QURAN interface">
    <img id="screen" alt="">
  </figure>

  <main class="final-card">
    <img src="assets/allim-wordmark-transparent.png" alt="ALLIM QURAN">
    <section class="principles" aria-label="Four ALLIM QURAN principles">
      <div class="principle"><small>01</small><span>Read</span></div>
      <div class="principle"><small>02</small><span>Understand</span></div>
      <div class="principle"><small>03</small><span>Remember</span></div>
      <div class="principle"><small>04</small><span>Live by it</span></div>
    </section>
    <p class="arabic" lang="ar" dir="rtl">اقرأ · افهم · احفظ · اعمل به</p>
    <p class="russian" lang="ru">ЧИТАЙ · ПОНИМАЙ · ЗАПОМИНАЙ · <strong>ВОПЛОЩАЙ</strong></p>
    <span class="domain">allimquran.com</span>
  </main>

  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var plate = params.get("plate") || "reading";
      var screens = {
        reading: "assets/ui-mobile-reading-ar.png",
        memory: "assets/ui-mobile-memory-ar.png",
        home: "assets/ui-mobile-home-ar.png"
      };
      document.body.dataset.plate = plate === "final" ? "final" : plate;
      if (plate !== "final") {
        document.getElementById("screen").src = screens[plate] || screens.reading;
      }
    })();
  </script>
</body>
</html>
