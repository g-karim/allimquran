# Include inside the ALLIM site's server block only. ASR must remain loopback-only.
location = /api/quran-asr/research {
    client_max_body_size 2k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

location = /api/quran-asr/health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
}

location = /api/quran-asr {
    client_max_body_size 12m;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
}

location ^~ /api/mushaf/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

location ^~ /api/quran/words/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

# Preserve the translation route already present in the live ALLIM server block.
location ^~ /api/quran/translation/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:4175;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}
