[project]
name = "allimquran"
authors = [{ name = "ALLIM Quran contributors" }]
description = "A community-built Quran learning application for Frappe"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = []  # Frappe is installed and managed by Bench.

[project.urls]
Homepage = "https://allimquran.com"
Repository = "https://github.com/g-karim/allimquran"
Issues = "https://github.com/g-karim/allimquran/issues"

[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
